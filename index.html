function ownerOf(t){return teamOwner[t];} function key(g){return `${g.date}-${g.time}-${g.away}-${g.home}`;} function currentWeek(){return document.getElementById('weekSelect').value || '1';} function defaultDoublers(){return {Tom:'',Nick:'',Marco:'',Sjoerd:''};} function getDoublers(week=null){const w=week || currentWeek(); if(!doublersByWeek[w]) doublersByWeek[w]=defaultDoublers(); return doublersByWeek[w];} function setTab(tab,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('gamesTab').classList.toggle('hidden',tab!=='games');document.getElementById('statsTab').classList.toggle('hidden',tab!=='stats');render();}
function pointsForGame(g){const s=scores[key(g)]||{away:'',home:''};const as=s.away===''?null:Number(s.away),hs=s.home===''?null:Number(s.home);const r={Tom:0,Nick:0,Marco:0,Sjoerd:0};if(as===null||hs===null||Number.isNaN(as)||Number.isNaN(hs))return r;const ds=getDoublers(gameWeek[key(g)]);const ao=ownerOf(g.away),ho=ownerOf(g.home);if(as>hs)r[ao]+=ds[ao]===g.away?2:1;if(hs>as)r[ho]+=ds[ho]===g.home?2:1;if(as===hs){r[ao]+=ds[ao]===g.away?1:.5;r[ho]+=ds[ho]===g.home?1:.5;}return r;}
function teamLogo(team,side){const o=ownerOf(team),st=owners[o],ds=getDoublers();return `<div class="teamwrap ${side}"><div class="logobox" title="${team} · ${o}"><img src="${logos[team]}" alt="${team} logo" style="filter:drop-shadow(0 0 28px ${st.glow}) drop-shadow(0 0 54px ${st.glow}) drop-shadow(0 12px 16px rgba(15,23,42,.20))">${ds[o]===team?'<div class="x2">🏈 x2</div>':''}</div></div>`;}


function loginAdmin(){const pin=document.getElementById('adminPin'); if(pin && pin.value===ADMIN_PIN){isAdmin=true; pin.value=''; render();} else {alert('Onjuiste PIN.'); if(pin) pin.value='';}}
function logoutAdmin(){isAdmin=false; render();}
function renderAdmin(){const controls=document.getElementById('adminControls'); if(!controls)return; if(isAdmin){controls.innerHTML=`<span id="adminStatus" class="adminstatus on">Admin actief</span><button class="toolbtn secondary" onclick="logoutAdmin()">Uitloggen</button>`}else{controls.innerHTML=`<span id="adminStatus" class="adminstatus off">Alleen lezen</span><input id="adminPin" type="password" placeholder="PIN" autocomplete="off" onkeydown="if(event.key==='Enter')loginAdmin()"><button class="toolbtn" onclick="loginAdmin()">Inloggen</button>`}}
function canEditWeek(w=currentWeek()){return isAdmin && !isWeekLocked(w);}

function saveLocal(){try{localStorage.setItem('nflPouleDataV18', JSON.stringify({scores,doublersByWeek,lockedWeeks}));}catch(e){}}
function loadLocal(){try{const raw=localStorage.getItem('nflPouleDataV18'); if(!raw)return; const data=JSON.parse(raw); scores=data.scores||{}; doublersByWeek=data.doublersByWeek||{}; lockedWeeks=data.lockedWeeks||{};}catch(e){}}
function isWeekLocked(w=currentWeek()){return !!lockedWeeks[w];}
function toggleWeekLock(){if(!isAdmin){alert('Alleen admin kan een week openen of vergrendelen.');return;} const w=currentWeek(); lockedWeeks[w]=!lockedWeeks[w]; saveLocal(); render();}
function safeNum(v){if(v===''||v===null||v===undefined)return null; const n=Number(v); return Number.isNaN(n)?null:n;}
function gameResult(g){const s=scores[key(g)]||{away:'',home:''}; const a=safeNum(s.away), h=safeNum(s.home); if(a===null||h===null)return null; if(a>h)return 'away'; if(h>a)return 'home'; return 'tie';}
function teamOutcome(g,t){const r=gameResult(g); if(!r)return 'open'; if(r==='tie')return 'tie'; return (r==='away'&&g.away===t)||(r==='home'&&g.home===t)?'win':'loss';}
function teamBasePoints(outcome){return outcome==='win'?1:outcome==='tie'?0.5:0;}
function teamPoints(g,t){const wk=gameWeek[key(g)], ds=getDoublers(wk), base=teamBasePoints(teamOutcome(g,t)); return ds[ownerOf(t)]===t?base*2:base;}
function doublerHitValue(g,t){const wk=gameWeek[key(g)], ds=getDoublers(wk); if(ds[ownerOf(t)]!==t)return 0; const outcome=teamOutcome(g,t); if(outcome==='win')return 1; if(outcome==='tie')return .5; return 0;}
function pct(v,total){return total?Math.round((v/total)*100):0;}

function populateWeeks(){const sel=document.getElementById('weekSelect');const current=sel.value||'1';sel.innerHTML=Object.keys(schedule).sort((a,b)=>Number(a)-Number(b)).map(w=>`<option value="${w}">Week ${w}</option>`).join('');sel.value=schedule[current]?current:'1';}
function renderDoublers(){const w=currentWeek();const ds=getDoublers();const locked=isWeekLocked(w);document.getElementById('doublers').innerHTML=`<div class="panel-head"><div><h2>Verdubbelaars week ${w}</h2></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="weeklock ${locked?'locked':'open'}" ${isAdmin?'':'disabled'} onclick="toggleWeekLock()">${locked?'🔒 Week vergrendeld':'🔓 Week open'}</button><div class="football">🏈 x2</div></div></div><div class="locknote ${locked?'locked':'open'}">${!isAdmin?'Alleen lezen. Log in als admin om te wijzigen.':locked?'Deze week is vergrendeld. Uitslagen en verdubbelaars zijn read-only.':'Deze week staat open. Uitslagen en verdubbelaars kunnen worden ingevuld.'}</div><div class="doublers" style="margin-top:12px">${Object.entries(owners).map(([o,d])=>`<div class="ownerbox" style="border-color:${d.color};background:linear-gradient(135deg, ${d.soft}, rgba(255,255,255,.94))"><label style="color:${d.text}">${o}</label><select ${canEditWeek(w)?'':'disabled'} class="${canEditWeek(w)?'':'adminlocked'}" onchange="if(!canEditWeek('${w}'))return;getDoublers()['${o}']=this.value;saveLocal();render()"><option value="" ${!ds[o]?'selected':''}>Geen keuze</option>${d.teams.map(t=>`<option value="${t}" ${ds[o]===t?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}</div>`;}
function renderGames(){const w=document.getElementById('weekSelect').value;document.getElementById('games').innerHTML=schedule[w].map(g=>{const k=key(g),s=scores[k]||{away:'',home:''},pts=pointsForGame(g);let winner='Nog niet gespeeld';if(s.away!==''&&s.home!=='') winner=Number(s.away)===Number(s.home)?'Gelijkspel':Number(s.away)>Number(s.home)?g.away:g.home;const chips=Object.entries(pts).filter(([o,p])=>p>0).map(([o,p])=>`<span class="pointchip" style="background:${owners[o].soft};color:${owners[o].text};box-shadow:0 0 12px ${owners[o].glow}">${o} +${p}</span>`).join('')||'<span class="pointchip" style="background:#e2e8f0;color:#64748b">punten volgen na invoer</span>'; return `<div class="game"><div class="game-head"><div><div class="weeklabel">Week ${w}</div><div class="datetime">${g.date} · ${g.time}</div></div>${g.note?`<div class="note">${g.note}</div>`:''}</div><div class="matchup">${teamLogo(g.away,'left')}<div class="score"><div class="vs">VS</div><div class="score-fields"><input min="0" type="number" value="${s.away}" ${canEditWeek(w)?'':'disabled'} class="${canEditWeek(w)?'':'adminlocked'}" oninput="if(!canEditWeek('${w}'))return;scores['${k}']={...(scores['${k}']||{home:'',away:''}),away:this.value};saveLocal()" onchange="render()" onblur="render()"><b>-</b><input min="0" type="number" value="${s.home}" ${canEditWeek(w)?'':'disabled'} class="${canEditWeek(w)?'':'adminlocked'}" oninput="if(!canEditWeek('${w}'))return;scores['${k}']={...(scores['${k}']||{home:'',away:''}),home:this.value};saveLocal()" onchange="render()" onblur="render()"></div></div>${teamLogo(g.home,'right')}</div><div class="result"><span>${chips}</span></div></div>`;}).join('');}
function rows(){const r=Object.keys(owners).map(o=>({owner:o,game:0,bonus:0,total:0}));Object.values(schedule).flat().forEach(g=>{const p=pointsForGame(g);r.forEach(row=>row.game+=p[row.owner]);});r.forEach(row=>row.total=row.game+row.bonus);return r.sort((a,b)=>b.total-a.total);}
function renderStandings(){document.getElementById('standings').innerHTML=rows().map((row,i)=>`<div class="standing" style="border-color:${owners[row.owner].color}"><div class="standing-top"><div><div class="rank">#${i+1}</div><h2 style="color:${owners[row.owner].text}">${row.owner}</h2></div><div class="totalbox"><small>Totaal</small><span>${row.total}</span></div></div><div class="mini"><div><b>${row.game}</b><span>wedstrijd</span></div><div><b>${row.bonus}</b><span>bonus</span></div><div><b>${owners[row.owner].teams.length}</b><span>teams</span></div></div></div>`).join('');}
function renderStats(){
  const ownerRows=Object.fromEntries(Object.keys(owners).map(o=>[o,{owner:o,total:0,normal:0,doublerExtra:0,wins:0,losses:0,draws:0,doublerHits:0,doublersUsed:0,weekly:{}}]));
  const teamRows=Object.fromEntries(Object.keys(teamOwner).map(t=>[t,{team:t,owner:ownerOf(t),points:0,wins:0,losses:0,draws:0,doublerHits:0,doublerExtra:0,played:0,homeWins:0,awayWins:0}]));
  const weekRows=[]; const gameRows=[]; const ownerHomeWins=Object.fromEntries(Object.keys(owners).map(o=>[o,0])); const ownerAwayWins=Object.fromEntries(Object.keys(owners).map(o=>[o,0]));
  Object.entries(schedule).forEach(([w,gs])=>{
    const weekScore=Object.fromEntries(Object.keys(owners).map(o=>[o,0]));
    gs.forEach(g=>{
      const s=scores[key(g)]||{away:'',home:''}; const a=safeNum(s.away), h=safeNum(s.home); if(a===null||h===null)return;
      const totalScore=a+h; const margin=Math.abs(a-h); const result=gameResult(g);
      gameRows.push({label:`${g.away} @ ${g.home}`,week:Number(w),totalScore,margin});
      [g.away,g.home].forEach(t=>{
        const o=ownerOf(t), outcome=teamOutcome(g,t), base=teamBasePoints(outcome), pts=teamPoints(g,t), extra=pts-base, hit=doublerHitValue(g,t);
        ownerRows[o].total+=pts; ownerRows[o].normal+=base; ownerRows[o].doublerExtra+=extra; ownerRows[o].doublerHits+=hit; ownerRows[o].weekly[w]=(ownerRows[o].weekly[w]||0)+pts; weekScore[o]+=pts;
        if(getDoublers(w)[o]===t) ownerRows[o].doublersUsed+=1;
        if(outcome==='win') ownerRows[o].wins+=1; else if(outcome==='tie') ownerRows[o].draws+=1; else if(outcome==='loss') ownerRows[o].losses+=1;
        teamRows[t].points+=pts; teamRows[t].doublerExtra+=extra; teamRows[t].doublerHits+=hit; teamRows[t].played+=1;
        if(outcome==='win') teamRows[t].wins+=1; else if(outcome==='tie') teamRows[t].draws+=1; else if(outcome==='loss') teamRows[t].losses+=1;
      });
      if(result==='home') { teamRows[g.home].homeWins+=1; ownerHomeWins[ownerOf(g.home)]+=1; }
      if(result==='away') { teamRows[g.away].awayWins+=1; ownerAwayWins[ownerOf(g.away)]+=1; }
    });
    Object.entries(weekScore).forEach(([owner,score])=>weekRows.push({week:Number(w),owner,score,completed:gs.some(g=>{const s=scores[key(g)]||{away:'',home:''};return safeNum(s.away)!==null&&safeNum(s.home)!==null;}),locked:!!lockedWeeks[w]}));
  });
  const ownersArr=Object.values(ownerRows).sort((a,b)=>b.total-a.total||a.owner.localeCompare(b.owner));
  const teamsArr=Object.values(teamRows).filter(t=>t.played>0).sort((a,b)=>b.points-a.points||b.wins-a.wins||a.team.localeCompare(b.team));
  const completed=gameRows.length;
  const leader=ownersArr[0]||{owner:'-',total:0};
  const ownerDot=(owner)=>{const st=owners[owner]||{};return `<span style="display:inline-flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:${st.color||'#94a3b8'};box-shadow:0 0 10px ${st.glow||'rgba(148,163,184,.5)'}"></span>${owner}</span>`};
  const weekLabel=(rows)=>rows.map(x=>`${ownerDot(x.owner)} <b>${x.score}</b>`).join(', ')||'-';
  const weekSub=(rows)=>rows.map(x=>`Week ${x.week}`).join(', ')||'';
  const highWeekVal=Math.max(0,...weekRows.filter(x=>x.completed).map(x=>x.score));
  const highWeekRows=weekRows.filter(x=>x.completed&&x.score===highWeekVal&&highWeekVal>0);
  const lockedCompleted=weekRows.filter(x=>x.locked&&x.completed);
  const lowWeekVal=lockedCompleted.length?Math.min(...lockedCompleted.map(x=>x.score)):0;
  const lowWeekRows=lockedCompleted.filter(x=>x.score===lowWeekVal);
  const highGame=gameRows.slice().sort((a,b)=>b.totalScore-a.totalScore)[0];
  const lowGame=gameRows.slice().sort((a,b)=>a.totalScore-b.totalScore)[0];
  const closeGame=gameRows.slice().sort((a,b)=>a.margin-b.margin)[0];
  const bestD=ownersArr.slice().sort((a,b)=>b.doublerHits-a.doublerHits||b.doublerExtra-a.doublerExtra)[0]||{owner:'-',doublerHits:0,doublersUsed:0};
  const bestTeam=teamsArr[0]||{team:'-',points:0}; const painTeam=teamsArr.slice().reverse()[0]||{team:'-',points:0};
  const mostWins=teamsArr.slice().sort((a,b)=>b.wins-a.wins||a.team.localeCompare(b.team))[0]||{team:'-',wins:0};
  const mostLosses=teamsArr.slice().sort((a,b)=>b.losses-a.losses||a.team.localeCompare(b.team))[0]||{team:'-',losses:0};
  const homeTeam=teamsArr.slice().sort((a,b)=>b.homeWins-a.homeWins||a.team.localeCompare(b.team))[0]||{team:'-',homeWins:0};
  const awayTeam=teamsArr.slice().sort((a,b)=>b.awayWins-a.awayWins||a.team.localeCompare(b.team))[0]||{team:'-',awayWins:0};
  const homeOwner=Object.entries(ownerHomeWins).sort((a,b)=>b[1]-a[1])[0]||['-',0]; const awayOwner=Object.entries(ownerAwayWins).sort((a,b)=>b[1]-a[1])[0]||['-',0];
  const lockedCount=Object.values(lockedWeeks).filter(Boolean).length;
  const cards=[
    ['🏆','League leader',`${leader.owner} · ${leader.total} pnt`,'Algemene leider op basis van ingevulde uitslagen.'],
    ['🔥','Hoogste weekscore',weekLabel(highWeekRows),weekSub(highWeekRows)],
    ['🥶','Laagste weekscore',weekLabel(lowWeekRows), lockedCompleted.length?weekSub(lowWeekRows):'Nog geen vergrendelde ingevulde week.'],
    ['🏈','Beste verdubbelaar',`${bestD.owner} · ${bestD.doublerHits} hits`,`${pct(bestD.doublerHits,bestD.doublersUsed)}% hitrate, gelijkspel telt als 0,5 hit.`],
    ['⭐','Beste team',`${bestTeam.team} · ${bestTeam.points} pnt`,'Team met meeste poulepunten.'],
    ['💀','Worst pick',`${painTeam.team} · ${painTeam.points} pnt`,'Team met minste poulepunten.'],
    ['✅','Meeste teamzeges',`${mostWins.team} · ${mostWins.wins}`,'Team met meeste overwinningen.'],
    ['📉','Meeste losses',`${mostLosses.team} · ${mostLosses.losses}`,'Team met meeste verliespartijen.'],
    ['🚀','Hoogste wedstrijdscore',highGame?`${highGame.label}`:'Nog geen', highGame?`${highGame.totalScore} totaalpunten.`:'Vul eerst uitslagen in.'],
    ['🧊','Laagste wedstrijdscore',lowGame?`${lowGame.label}`:'Nog geen', lowGame?`${lowGame.totalScore} totaalpunten.`:'Vul eerst uitslagen in.'],
    ['⚖️','Kleinste marge',closeGame?`${closeGame.label}`:'Nog geen', closeGame?`${closeGame.margin} punt(en) verschil.`:'Vul eerst uitslagen in.'],
    ['🏠','Beste thuis-speler',`${homeOwner[0]} · ${homeOwner[1]}`,'Meeste thuisoverwinningen.'],
    ['✈️','Beste uit-speler',`${awayOwner[0]} · ${awayOwner[1]}`,'Meeste uitoverwinningen.'],
    ['🏠','Meeste thuiswins team',`${homeTeam.team} · ${homeTeam.homeWins}`,'Team met meeste thuisoverwinningen.'],
    ['✈️','Meeste uitwins team',`${awayTeam.team} · ${awayTeam.awayWins}`,'Team met meeste uitoverwinningen.'],
    ['🔒','Vergrendelde weken',`${lockedCount} / ${Object.keys(schedule).length}`, 'Weeklock geldt voor scores en verdubbelaars.'],
    ['📅','Gespeelde wedstrijden',`${completed} / ${Object.values(schedule).flat().length}`, 'Aantal wedstrijden met ingevulde score.']
  ];
  const cardsHtml=cards.map(c=>`<div class="stat"><div class="ico">${c[0]}</div><h3>${c[1]}</h3><div class="val">${c[2]}</div>${c[3]?`<p>${c[3]}</p>`:''}</div>`).join('');
  const rankingTable=`<div class="tablecard"><h2>Tussenstand</h2><div class="tablegrid"><div class="tablehead">#</div><div class="tablehead text-right">Speler</div><div class="tablehead text-right">Punten</div><div class="tablehead text-right">W-L-D</div><div class="tablehead text-right">🏈 x2 Hits</div>${ownersArr.map((r,i)=>`<div>${i+1}</div><div class="text-right"><b>${r.owner}</b></div><div class="text-right"><b>${r.total}</b></div><div class="text-right">${r.wins}-${r.losses}-${r.draws}</div><div class="text-right">${r.doublerHits}</div>`).join('')}</div></div>`;
  const ownerTable=`<div class="tablecard"><h2>Uitgebreide spelersstatistieken</h2><div class="tablegrid"><div class="tablehead">Speler</div><div class="tablehead text-right">Punten</div><div class="tablehead text-right">Wins</div><div class="tablehead text-right">Losses</div><div class="tablehead text-right">🏈 x2 Hits</div>${ownersArr.map(r=>`<div>${r.owner}</div><div class="text-right"><b>${r.total}</b></div><div class="text-right">${r.wins}</div><div class="text-right">${r.losses}</div><div class="text-right">${r.doublerHits}</div>`).join('')}</div></div>`;
  const topTeams=`<div class="tablecard"><h2>Top teams</h2><div class="tablegrid"><div class="tablehead">Team</div><div class="tablehead text-right">Eigenaar</div><div class="tablehead text-right">Punten</div><div class="tablehead text-right">W-L-D</div><div class="tablehead text-right">🏈 x2 Hits</div>${teamsArr.slice(0,5).map(r=>`<div>${r.team}</div><div class="text-right">${r.owner}</div><div class="text-right"><b>${r.points}</b></div><div class="text-right">${r.wins}-${r.losses}-${r.draws}</div><div class="text-right">${r.doublerHits}</div>`).join('')}</div></div>`;
  const worstTeams=`<div class="tablecard"><h2>Worst teams</h2><div class="tablegrid"><div class="tablehead">Team</div><div class="tablehead text-right">Eigenaar</div><div class="tablehead text-right">Punten</div><div class="tablehead text-right">W-L-D</div><div class="tablehead text-right">Dbl extra</div>${teamsArr.slice().reverse().slice(0,5).map(r=>`<div>${r.team}</div><div class="text-right">${r.owner}</div><div class="text-right"><b>${r.points}</b></div><div class="text-right">${r.wins}-${r.losses}-${r.draws}</div><div class="text-right">+${r.doublerExtra}</div>`).join('')}</div></div>`;
  document.getElementById('stats').innerHTML=rankingTable+cardsHtml+ownerTable+topTeams+worstTeams;
}
function render(){renderAdmin();renderDoublers();renderGames();renderStats();} loadLocal(); populateWeeks(); render();
</script></body></html>
